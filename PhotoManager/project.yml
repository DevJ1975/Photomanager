name: PhotoManager
options:
  bundleIdPrefix: com.photomanager
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"       # iPhone + iPad
    SUPPORTS_MACCATALYST: NO
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_ASSET_PATHS: "\"PhotoManager/Preview Content\""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PhotoManager:
    type: application
    platform: iOS
    sources:
      - path: PhotoManager
        excludes:
          - "Resources/Info.plist"
    resources:
      - PhotoManager/Resources/Assets.xcassets
      - PhotoManager/Preview Content/Preview Assets.xcassets
    info:
      path: PhotoManager/Resources/Info.plist
      properties:
        CFBundleDisplayName: PhotoManager
        NSPhotoLibraryUsageDescription: "PhotoManager needs access to your photos so you can browse, organize, favorite, and share them."
        NSPhotoLibraryAddUsageDescription: "PhotoManager can save edited or imported photos to your library."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photomanager.PhotoManager
        INFOPLIST_FILE: PhotoManager/Resources/Info.plist
